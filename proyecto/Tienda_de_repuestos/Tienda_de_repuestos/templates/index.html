<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    AGREGO CAMBIO

    <p>El apellido es: {{apellido}}</p>
    <p>Ahora son las {{ahora}}</p>

    {% for nota in notas %}

        {% if nota <= 5%}
            <p style="color:red">La nota es mala: {{nota}}</p>
        {% else %}
            <p>La nota es buena: {{nota}}</p>
        {% endif %}

    {% endfor %}


</body>
</html>
